services:
  mariadb:
    restart: unless-stopped
    image: mariadb:11
    environment:
      - MARIADB_USER=bn_magento
      - MARIADB_PASSWORD=bitnami123
      - MARIADB_DATABASE=bitnami_magento
      - MARIADB_ROOT_PASSWORD=root123
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    restart: unless-stopped
    image: elasticsearch:8.19.15
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:7
    command: redis-server --requirepass redis123
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  magento-fpm:
    restart: unless-stopped
    image: mappia/magento2:fpm-alpine2.4.7
    volumes:
      - magento_code:/var/www/html
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - magento_code:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - magento-fpm
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  magento-init:
    profiles: ["init"]
    image: mappia/magento2:cli-alpine2.4.7
    volumes:
      - magento_code:/data
      - ./scripts:/scripts:ro
      - ./media/product-images:/data/product-images:ro
    environment:
      - DB_HOST=mariadb
      - DB_NAME=bitnami_magento
      - DB_USER=bn_magento
      - DB_PASSWORD=bitnami123
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis123
      - BASE_URL=http://localhost:8080
      - ADMIN_USER=admin
      - ADMIN_PASS=Admin12345
      - ADMIN_EMAIL=admin@example.com
    command: >
      sh -c "
        echo 'magento-init container ready. Use step scripts to run setup.'
      "
    depends_on:
      mariadb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mariadb_data:
  elasticsearch_data:
  redis_data:
  magento_code:
